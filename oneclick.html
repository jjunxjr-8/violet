<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COSMOS OneClick — 3D Sphere</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #0f0a18;
      --accent-purple: #8e44ad;
      --accent-light: #c88df2;
      --text-color: #f4f4f6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-color);
      font-family: 'Google Sans', system-ui, -apple-system, sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* Overlay UI */
    .header-bar {
      position: absolute;
      top: 24px;
      left: 24px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      color: #ffffff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      backdrop-filter: blur(10px);
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .back-btn:hover {
      background: rgba(255, 255, 255, 0.18);
      transform: translateX(-2px);
    }

    .page-title {
      position: absolute;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      text-align: center;
      pointer-events: none;
    }

    .page-title h1 {
      font-size: 24px;
      font-weight: 500;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, #ffffff 0%, var(--accent-light) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .page-title p {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.6);
      margin-top: 4px;
    }
  </style>

  <!-- Three.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- OrbitControls -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div class="header-bar">
    <a href="index.html" class="back-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
        <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
      </svg>
      Back to COSMOS Violet
    </a>
  </div>

  <div class="page-title">
    <h1>COSMOS OneClick</h1>
    <p>3D Interactive Neural Network Sphere</p>
  </div>

  <div id="canvas-container"></div>

  <script>
    // --- THREE.JS SETUP ---
    const container = document.getElementById('canvas-container');

    const scene = new THREE.Scene();
    // Add subtle ambient fog for depth
    scene.fog = new THREE.FogExp2(0x0f0a18, 0.035);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 18;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // Orbit Controls for interactivity
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.rotateSpeed = 0.8;
    controls.enableZoom = true;

    // --- LIGHTING ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const pointLight1 = new THREE.PointLight(0xa663cc, 2.5, 50);
    pointLight1.position.set(15, 15, 15);
    scene.add(pointLight1);

    const pointLight2 = new THREE.PointLight(0x6f2bdb, 3, 50);
    pointLight2.position.set(-15, -15, -15);
    scene.add(pointLight2);

    // --- SPHERE OF SPHERES GENERATION ---
    const mainGroup = new THREE.Group();
    scene.add(mainGroup);

    const numSpheres = 450; // Number of smaller spheres
    const mainRadius = 7.5; // Radius of the large outer sphere
    const smallSphereRadius = 0.22; // Size of each small sphere

    // Shared geometry & material for high performance (Instanced Mesh)
    const smallSphereGeo = new THREE.SphereGeometry(smallSphereRadius, 16, 16);
    
    // Purple / Violet shiny material
    const material = new THREE.MeshStandardMaterial({
      color: 0x9b59b6,
      roughness: 0.2,
      metalness: 0.8,
      emissive: 0x3d1259,
      emissiveIntensity: 0.4
    });

    const instancedMesh = new THREE.InstancedMesh(smallSphereGeo, material, numSpheres);
    const dummy = new THREE.Object3D();
    const colors = [0x6f2bdb, 0xa663cc, 0x5821b3, 0x8e44ad, 0x3498db];

    // Fibonacci Sphere Algorithm to evenly distribute small spheres on the outer surface
    const phi = Math.PI * (3 - Math.sqrt(5)); // Golden angle in radians

    for (let i = 0; i < numSpheres; i++) {
      const y = 1 - (i / (numSpheres - 1)) * 2; // Ranging from 1 to -1
      const radiusAtY = Math.sqrt(1 - y * y);
      const theta = phi * i;

      const x = Math.cos(theta) * radiusAtY;
      const z = Math.sin(theta) * radiusAtY;

      // Position scaled to the main sphere radius
      dummy.position.set(x * mainRadius, y * mainRadius, z * mainRadius);

      // Random small scale variations for visual interest
      const scale = 0.7 + Math.random() * 0.6;
      dummy.scale.set(scale, scale, scale);

      dummy.updateMatrix();
      instancedMesh.setMatrixAt(i, dummy.matrix);

      // Apply subtle purple variations to individual spheres
      const colorHex = colors[i % colors.length];
      instancedMesh.setColorAt(i, new THREE.Color(colorHex));
    }

    mainGroup.add(instancedMesh);

    // Inner Glowing Core Sphere
    const coreGeo = new THREE.SphereGeometry(mainRadius * 0.7, 32, 32);
    const coreMat = new THREE.MeshBasicMaterial({
      color: 0x6f2bdb,
      wireframe: true,
      transparent: true,
      opacity: 0.15
    });
    const coreMesh = new THREE.Mesh(coreGeo, coreMat);
    mainGroup.add(coreMesh);

    // --- ANIMATION LOOP ---
    function animate() {
      requestAnimationFrame(animate);

      // Continuous 3D Rotation
      mainGroup.rotation.y += 0.003;
      mainGroup.rotation.x += 0.0015;

      coreMesh.rotation.y -= 0.002;

      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    // --- RESPONSIVE RESIZE ---
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
